version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: pitcherai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: pitcherai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pitcherai"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://pitcherai:${POSTGRES_PASSWORD:-changeme}@postgres/pitcherai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      MAX_EMAILS_PER_DAY: ${MAX_EMAILS_PER_DAY:-50}
      EMAIL_FREQUENCY: ${EMAIL_FREQUENCY:-1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      sh -c "
        uv run python -c \"from pitcherai.database import init_db; import asyncio; asyncio.run(init_db)\" &&
        uvicorn pitcherai.main:app --host 0.0.0.0 --port 8000
      "
    restart: unless-stopped

  celery-worker:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://pitcherai:${POSTGRES_PASSWORD:-changeme}@postgres/pitcherai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GMAIL_CLIENT_ID: ${GMAIL_CLIENT_ID}
      GMAIL_CLIENT_SECRET: ${GMAIL_CLIENT_SECRET}
      GMAIL_REFRESH_TOKEN: ${GMAIL_REFRESH_TOKEN}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
    command: uv run celery -A pitcherai.tasks worker --loglevel=info
    restart: unless-stopped

  celery-beat:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://pitcherai:${POSTGRES_PASSWORD:-changeme}@postgres/pitcherai
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      web:
        condition: service_started
      celery-worker:
        condition: service_started
    command: uv run celery -A pitcherai.tasks beat --loglevel=info
    restart: unless-stopped

  dashboard:
    build: .
    ports:
      - "8501:8501"
    environment:
      DATABASE_URL: postgresql+asyncpg://pitcherai:${POSTGRES_PASSWORD:-changeme}@postgres/pitcherai
      API_BASE_URL: ${API_BASE_URL:-http://localhost:8000}
    depends_on:
      postgres:
        condition: service_healthy
      web:
        condition: service_started
    volumes:
      - ./logs:/app/logs
    command: >
      sh -c "
        streamlit run src/pitcherai/dashboard/app.py --server.address 0.0.0.0 --server.port 8501
      "
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
