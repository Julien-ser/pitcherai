[project]
name = "pitcherai"
version = "0.1.0"
description = "AI-Powered autonomous VC outreach agent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "PitcherAI Team"}]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    "asyncpg>=0.29.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "email-validator>=2.1.0",
    "aiosqlite>=0.20.0",
    "openai>=1.3.0",
    "httpx>=0.25.0",
    "google-auth>=2.23.0",
    "google-auth-oauthlib>=1.1.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.108.0",
    "celery>=5.3.0",
    "redis>=5.0.1",
    "streamlit>=1.28.0",
    "pandas>=2.1.3",
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.11",
    "pyright>=1.1.334",
]

[project.optional-dependencies]
dev = [
    "ipython>=8.17.0",
    "ipdb>=0.13.0",
]

[project.scripts]
pitcherai = "pitcherai.cli:main"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "YTT", "S", "BLE", "FBT", "C4", "ICN", "PIE", "PT", "Q", "RSE", "RET", "SIM", "TID", "ARG", "EM", "PL", "TRY", "RUF"]
ignore = ["S101", "TRY003"]

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]
strict = ["src/**/*.py"]
venv = ".venv"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=src --cov-report=term-missing --cov-report=html"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pitcherai"]
