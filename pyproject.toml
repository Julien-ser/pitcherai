[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pitcherai"
version = "0.1.0"
description = "AI-Powered Startup Pitch Generator and Outreach Automation"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "feedparser>=6.0.0",
    "google-auth>=2.0.0",
    "google-auth-oauthlib>=1.0.0",
    "google-api-python-client>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.0",
    "pyright>=1.1.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.15.0",
    "pyright>=1.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["src"]